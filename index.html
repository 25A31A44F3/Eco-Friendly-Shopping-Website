<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoCart — Shop Better. Live Greener.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --forest:#14532D; --forest-2:#0e3d21; --emerald:#16A34A; --lime:#84CC16;
  --cream:#F7F8F2; --white:#FFFFFF; --charcoal:#17211B;
  --bg:var(--cream); --surface:#FFFFFF; --surface-2:#F1F3EC;
  --text:#17211B; --text-soft:#526051; --text-faint:#7c8a79;
  --border:#e3e7db; --shadow:0 10px 30px rgba(20,83,45,.09); --shadow-lg:0 22px 50px rgba(20,83,45,.14);
  --radius:16px; --radius-sm:10px;
  --grad: linear-gradient(135deg,var(--forest) 0%, var(--emerald) 100%);
}
[data-theme="dark"]{
  --bg:#0d130f; --surface:#151d17; --surface-2:#1b241d;
  --text:#EEF3EA; --text-soft:#a9b8a5; --text-faint:#7f8f7c;
  --border:#26332a; --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --cream:#0d130f; --white:#151d17;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15.5px;line-height:1.6;transition:background .35s ease,color .35s ease;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.font-display{font-family:'Poppins',sans-serif;color:var(--text);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
ul{margin:0;padding:0;list-style:none;}
.icon{width:1em;height:1em;}
.container{max-width:1240px;margin:0 auto;padding:0 24px;}
::selection{background:var(--lime);color:var(--charcoal);}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:100px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(22,163,74,.28);}
.btn-primary:hover{box-shadow:0 14px 32px rgba(22,163,74,.4);transform:translateY(-2px);}
.btn-outline{background:transparent;border-color:var(--forest);color:var(--forest);}
[data-theme="dark"] .btn-outline{border-color:var(--lime);color:var(--lime);}
.btn-outline:hover{background:var(--forest);color:#fff;}
[data-theme="dark"] .btn-outline:hover{background:var(--lime);color:var(--charcoal);}
.btn-dark{background:var(--charcoal);color:#fff;}
.btn-dark:hover{background:#0c130e;}
.btn-lime{background:var(--lime);color:var(--charcoal);}
.btn-lime:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(132,204,22,.35);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px;font-size:13.5px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none !important;}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:var(--border);}

/* ---------- Navbar ---------- */
.navbar{position:sticky;top:0;z-index:200;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.nav-inner{max-width:1300px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:74px;gap:18px;}
.brand{display:flex;align-items:center;gap:9px;font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;color:var(--forest);flex-shrink:0;}
[data-theme="dark"] .brand{color:var(--lime);}
.brand .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand .brand-mark .icon{width:20px;height:20px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{padding:9px 16px;border-radius:100px;font-weight:600;font-size:14.5px;color:var(--text-soft);transition:all .2s ease;position:relative;}
.nav-link:hover{color:var(--forest);background:var(--surface-2);}
[data-theme="dark"] .nav-link:hover{color:var(--lime);}
.nav-link.active{color:#fff;background:var(--grad);}
.nav-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;transition:all .2s ease;flex-shrink:0;}
.icon-btn .icon{width:19px;height:19px;}
.icon-btn:hover{border-color:var(--emerald);color:var(--emerald);transform:translateY(-1px);}
.icon-btn .count{position:absolute;top:-4px;right:-4px;background:var(--lime);color:var(--charcoal);font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg);}
.search-wrap{position:relative;display:flex;align-items:center;}
.search-input{width:0;opacity:0;padding:0;border:none;border-radius:100px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14px;transition:width .3s ease,opacity .2s ease,padding .3s ease;position:absolute;right:44px;height:42px;}
.search-wrap.open .search-input{width:220px;opacity:1;padding:0 16px;}
.mobile-toggle{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;color:var(--text);}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:14px 24px 20px;border-top:1px solid var(--border);background:var(--bg);}
.mobile-menu.open{display:flex;}
.mobile-menu .nav-link{display:block;text-align:left;}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:70px 0 90px;background:radial-gradient(circle at 85% 0%, rgba(132,204,22,.16), transparent 55%), radial-gradient(circle at 0% 100%, rgba(22,163,74,.12), transparent 50%);}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--emerald);box-shadow:var(--shadow);}
.hero-eyebrow .icon{width:14px;height:14px;}
.hero h1{font-size:clamp(36px,4.6vw,58px);line-height:1.06;margin:18px 0 20px;font-weight:800;}
.hero h1 span{color:var(--emerald);}
.hero p.lead{font-size:17.5px;color:var(--text-soft);max-width:480px;margin-bottom:32px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:38px;}
.hero-stats{display:flex;gap:34px;flex-wrap:wrap;}
.hero-stat b{font-family:'Poppins',sans-serif;font-size:26px;display:block;color:var(--forest);}
[data-theme="dark"] .hero-stat b{color:var(--lime);}
.hero-stat span{font-size:12.5px;color:var(--text-faint);font-weight:600;}
.hero-visual{position:relative;height:440px;border-radius:28px;background:var(--grad);overflow:hidden;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;}
.hero-visual::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 45%);}
.hero-visual .hv-icon{width:150px;height:150px;color:rgba(255,255,255,.92);}
.hero-visual .float-card{position:absolute;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;color:var(--charcoal);font-weight:700;font-size:13.5px;animation:floaty 5s ease-in-out infinite;}
.float-card .icon{width:18px;height:18px;color:var(--emerald);}
.fc1{top:26px;left:-18px;animation-delay:.2s;}
.fc2{bottom:34px;right:-14px;animation-delay:1.1s;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---------- Sections ---------- */
.section{padding:78px 0;}
.section-tight{padding:50px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:38px;flex-wrap:wrap;}
.eyebrow{font-size:13px;font-weight:700;color:var(--emerald);margin-bottom:8px;display:inline-block;}
.section-head h2{font-size:clamp(26px,3vw,36px);font-weight:700;}
.section-head p{color:var(--text-soft);margin-top:8px;max-width:520px;}
.section-alt{background:var(--surface-2);}

/* ---------- Stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 22px;text-align:center;box-shadow:var(--shadow);}
.stat-card .icon-wrap{width:52px;height:52px;border-radius:14px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.stat-card .icon-wrap .icon{width:26px;height:26px;}
.stat-card b{font-family:'Poppins',sans-serif;font-size:30px;display:block;}
.stat-card span{color:var(--text-soft);font-size:13.5px;font-weight:600;}

/* ---------- Categories ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 20px;text-align:center;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;cursor:pointer;}
.cat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--emerald);}
.cat-card .cat-icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;}
.cat-card .cat-icon .icon{width:28px;height:28px;}
.cat-card h4{font-size:15px;margin-bottom:4px;}
.cat-card span{color:var(--text-faint);font-size:12.5px;}

/* ---------- Product cards ---------- */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease;display:flex;flex-direction:column;}
.product-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);}
.product-visual{position:relative;height:180px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.95);}
.product-visual .icon{width:56px;height:56px;}
.product-visual::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 15%, rgba(255,255,255,.25), transparent 55%);}
.pv-actions{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:2;}
.pv-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;color:var(--charcoal);box-shadow:0 4px 10px rgba(0,0,0,.18);transition:all .2s ease;}
.pv-btn:hover{background:#fff;transform:scale(1.08);}
.pv-btn.active{background:var(--lime);color:var(--charcoal);}
.pv-btn .icon{width:16px;height:16px;}
.eco-chip{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.95);color:var(--forest);font-weight:800;font-size:11.5px;padding:5px 9px;border-radius:100px;display:flex;align-items:center;gap:4px;z-index:2;}
.eco-chip .icon{width:11px;height:11px;}
.discount-chip{position:absolute;bottom:10px;left:10px;background:var(--charcoal);color:#fff;font-weight:700;font-size:11px;padding:4px 9px;border-radius:6px;z-index:2;}
.product-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
.p-cat{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.p-name{font-size:15px;font-weight:600;line-height:1.35;}
.p-rating{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-faint);}
.p-rating .stars{display:flex;gap:1px;color:#f2b705;}
.p-rating .stars .icon{width:13px;height:13px;}
.p-price-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
.p-price{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;color:var(--forest);}
[data-theme="dark"] .p-price{color:var(--lime);}
.p-old{font-size:13px;color:var(--text-faint);text-decoration:line-through;}
.card-footer{display:flex;gap:8px;margin-top:10px;}
.card-footer .btn{flex:1;padding:10px;font-size:13px;}
.compare-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-faint);margin-top:2px;cursor:pointer;user-select:none;}
.compare-toggle input{accent-color:var(--emerald);width:14px;height:14px;}

/* ---------- Shop layout ---------- */
.shop-layout{display:grid;grid-template-columns:270px 1fr;gap:30px;align-items:start;}
.filters-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:sticky;top:92px;}
.filters-panel h3{font-size:15.5px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.filters-panel h3 .icon{width:16px;height:16px;color:var(--emerald);}
.filter-group{padding:16px 0;border-bottom:1px solid var(--border);}
.filter-group:first-of-type{padding-top:0;}
.filter-group:last-of-type{border-bottom:none;padding-bottom:0;}
.filter-group h4{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);margin-bottom:12px;}
.filter-row{display:flex;align-items:center;gap:9px;font-size:14px;padding:5px 0;cursor:pointer;color:var(--text-soft);}
.filter-row input{accent-color:var(--emerald);width:15px;height:15px;}
.filter-row:hover{color:var(--text);}
.range-slider{width:100%;accent-color:var(--emerald);margin-top:6px;}
.range-val{font-size:13px;color:var(--text-soft);display:flex;justify-content:space-between;margin-top:4px;}
.star-filter{display:flex;gap:6px;}
.star-filter button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--text-soft);display:flex;align-items:center;gap:4px;}
.star-filter button.active{background:var(--grad);color:#fff;border-color:transparent;}
.star-filter .icon{width:12px;height:12px;}
.shop-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.shop-search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:11px 18px;}
.shop-search .icon{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.shop-search input{border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;color:var(--text);width:100%;}
.sort-select{border:1px solid var(--border);background:var(--surface);border-radius:100px;padding:11px 18px;font-family:inherit;font-size:13.5px;color:var(--text);font-weight:600;}
.result-count{font-size:13.5px;color:var(--text-faint);margin-bottom:16px;}
.clear-filters{font-size:12.5px;color:var(--emerald);font-weight:700;cursor:pointer;}

/* ---------- Product detail ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;}
.detail-visual{height:440px;border-radius:24px;background:var(--grad);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
.detail-visual .icon{width:150px;height:150px;color:rgba(255,255,255,.92);}
.thumb-row{display:flex;gap:10px;margin-top:14px;}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--grad);opacity:.55;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
.thumb.active{opacity:1;border-color:var(--emerald);}
.thumb .icon{width:26px;height:26px;}
.breadcrumb{font-size:13px;color:var(--text-faint);margin-bottom:20px;display:flex;gap:6px;align-items:center;}
.breadcrumb a:hover{color:var(--emerald);}
.d-cat{color:var(--emerald);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;}
.d-name{font-size:30px;font-weight:700;margin:8px 0 10px;}
.d-rating{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.d-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.d-price{font-family:'Poppins',sans-serif;font-size:32px;font-weight:800;color:var(--forest);}
[data-theme="dark"] .d-price{color:var(--lime);}
.d-old{font-size:16px;color:var(--text-faint);text-decoration:line-through;}
.d-save{font-size:12.5px;background:#fee2e2;color:#b91c1c;padding:3px 9px;border-radius:100px;font-weight:700;}
[data-theme="dark"] .d-save{background:#3f1d1d;color:#f87171;}
.info-pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;}
.info-pill{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.info-pill .icon{width:18px;height:18px;color:var(--emerald);flex-shrink:0;}
.info-pill b{display:block;font-size:13px;}
.info-pill span{font-size:11.5px;color:var(--text-faint);}
.qty-selector{display:flex;align-items:center;border:1px solid var(--border);border-radius:100px;overflow:hidden;width:fit-content;}
.qty-selector button{width:40px;height:40px;background:var(--surface-2);border:none;display:flex;align-items:center;justify-content:center;color:var(--text);}
.qty-selector button:hover{background:var(--border);}
.qty-selector span{width:44px;text-align:center;font-weight:700;}
.d-actions-row{display:flex;align-items:center;gap:14px;margin:22px 0;flex-wrap:wrap;}
.d-btn-row{display:flex;gap:12px;flex-wrap:wrap;}
.d-btn-row .btn{flex:1;min-width:160px;}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:44px 0 22px;overflow-x:auto;}
.tab-btn{padding:12px 18px;font-weight:600;font-size:14px;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--emerald);border-color:var(--emerald);}
.tab-panel{display:none;line-height:1.85;color:var(--text-soft);}
.tab-panel.active{display:block;}
.spec-table{width:100%;border-collapse:collapse;}
.spec-table tr{border-bottom:1px solid var(--border);}
.spec-table td{padding:11px 4px;font-size:14px;}
.spec-table td:first-child{color:var(--text-faint);font-weight:600;width:40%;}
.review-item{border-bottom:1px solid var(--border);padding:18px 0;}
.review-item:last-child{border:none;}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.review-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}

/* ---------- Compare ---------- */
.compare-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
.compare-table{width:100%;border-collapse:collapse;min-width:640px;background:var(--surface);}
.compare-table th,.compare-table td{padding:16px 18px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;vertical-align:top;}
.compare-table th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);width:170px;}
.compare-table td.label-row{font-weight:700;color:var(--text-faint);background:var(--surface-2);}
.compare-slot-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;}
.compare-slot-empty .icon{width:30px;height:30px;color:var(--text-faint);}
.compare-remove{margin-top:10px;font-size:12px;color:#dc2626;font-weight:700;cursor:pointer;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:70px 20px;}
.empty-state .es-icon{width:90px;height:90px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:var(--text-faint);}
.empty-state .es-icon .icon{width:38px;height:38px;}
.empty-state h3{font-size:20px;margin-bottom:8px;}
.empty-state p{color:var(--text-soft);margin-bottom:24px;}

/* ---------- Cart ---------- */
.cart-layout{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start;}
.cart-item{display:grid;grid-template-columns:74px 1fr auto auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.cart-thumb{width:74px;height:74px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;}
.cart-thumb .icon{width:30px;height:30px;}
.cart-name{font-weight:600;font-size:14.5px;margin-bottom:3px;}
.cart-meta{font-size:12.5px;color:var(--text-faint);}
.cart-qty{display:flex;align-items:center;border:1px solid var(--border);border-radius:100px;}
.cart-qty button{width:30px;height:30px;background:none;border:none;color:var(--text);}
.cart-qty span{width:28px;text-align:center;font-size:13px;font-weight:700;}
.cart-remove{color:var(--text-faint);}
.cart-remove:hover{color:#dc2626;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:sticky;top:92px;}
.summary-row{display:flex;justify-content:space-between;font-size:14.5px;padding:9px 0;color:var(--text-soft);}
.summary-row.total{border-top:1px solid var(--border);margin-top:8px;padding-top:14px;font-weight:800;font-size:17px;color:var(--text);}
.impact-box{margin-top:20px;background:linear-gradient(135deg,rgba(22,163,74,.12),rgba(132,204,22,.12));border:1px solid rgba(22,163,74,.25);border-radius:14px;padding:16px 18px;}
.impact-box h4{font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--forest);}
[data-theme="dark"] .impact-box h4{color:var(--lime);}
.impact-box .icon{width:15px;height:15px;}
.impact-line{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--text-soft);}
.impact-line b{color:var(--text);}

/* ---------- Checkout ---------- */
.checkout-layout{display:grid;grid-template-columns:1fr 380px;gap:30px;align-items:start;}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.form-section h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.form-section h3 .icon{width:17px;height:17px;color:var(--emerald);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12.5px;font-weight:600;color:var(--text-faint);}
.form-field input,.form-field select,.form-field textarea{padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:var(--surface-2);color:var(--text);width:100%;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--emerald);}
.payment-options{display:grid;gap:10px;}
.payment-option{border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s ease;}
.payment-option:hover{border-color:var(--emerald);}
.payment-option.active{border-color:var(--emerald);background:rgba(22,163,74,.06);}
.payment-option .icon{width:18px;height:18px;color:var(--emerald);}
.payment-option b{font-size:14px;display:block;}
.payment-option span{font-size:12px;color:var(--text-faint);}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);margin-left:auto;flex-shrink:0;position:relative;}
.payment-option.active .radio-dot{border-color:var(--emerald);}
.payment-option.active .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--emerald);}
.pkg-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-top:6px;}
.switch{width:44px;height:24px;border-radius:100px;background:var(--border);position:relative;transition:background .2s ease;flex-shrink:0;}
.switch.on{background:var(--emerald);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease;}
.switch.on::after{transform:translateX(20px);}
.order-line{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:13.5px;}
.order-line .ol-thumb{width:40px;height:40px;border-radius:8px;background:var(--grad);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.order-line .ol-thumb .icon{width:18px;height:18px;}
.order-line .ol-name{flex:1;}
.success-screen{text-align:center;padding:90px 20px;max-width:520px;margin:0 auto;}
.success-icon{width:96px;height:96px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 26px;box-shadow:0 20px 45px rgba(22,163,74,.35);animation:popIn .5s ease;}
.success-icon .icon{width:44px;height:44px;}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.order-id{background:var(--surface-2);border-radius:12px;padding:14px;margin:24px 0;font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;}

/* ---------- Impact dashboard ---------- */
.impact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:34px;}
.impact-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.impact-card .ic-icon{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:14px;}
.impact-card .ic-icon .icon{width:24px;height:24px;}
.impact-card b{font-family:'Poppins',sans-serif;font-size:26px;display:block;}
.impact-card span{color:var(--text-faint);font-size:13px;font-weight:600;}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:34px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
.chart-card h3{font-size:16px;margin-bottom:18px;}
.progress-wrap{margin-bottom:18px;}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--text-soft);}
.progress-bar{height:10px;border-radius:100px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--grad);border-radius:100px;transition:width 1.2s ease;}
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.badge-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 14px;text-align:center;transition:transform .2s ease;}
.badge-item.earned{border-color:var(--lime);background:linear-gradient(160deg,rgba(132,204,22,.1),transparent);}
.badge-item:hover{transform:translateY(-4px);}
.badge-item .b-icon{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--text-faint);}
.badge-item.earned .b-icon{background:var(--grad);color:#fff;}
.badge-item .b-icon .icon{width:24px;height:24px;}
.badge-item h5{font-size:13px;margin-bottom:3px;}
.badge-item span{font-size:11px;color:var(--text-faint);}
.milestone-list{display:flex;flex-direction:column;gap:0;}
.milestone{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.milestone:last-child{border:none;}
.milestone .m-dot{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.milestone .m-dot .icon{width:16px;height:16px;}
.history-table{width:100%;border-collapse:collapse;}
.history-table th{text-align:left;font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border);}
.history-table td{padding:13px 12px;border-bottom:1px solid var(--border);font-size:13.5px;}
.status-pill{background:rgba(22,163,74,.12);color:var(--emerald);padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700;}

/* ---------- About ---------- */
.about-hero{background:var(--grad);border-radius:28px;padding:64px 44px;color:#fff;text-align:center;margin-bottom:60px;}
.about-hero h1{font-size:clamp(30px,4vw,44px);margin-bottom:14px;color:#fff;}
.about-hero p{max-width:640px;margin:0 auto;opacity:.92;font-size:16px;}
.about-split{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;margin-bottom:70px;}
.about-split .av{height:280px;border-radius:22px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--emerald);}
.about-split .av .icon{width:80px;height:80px;}
.principles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.principle-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;}
.principle-card .icon-wrap{width:48px;height:48px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.principle-card .icon-wrap .icon{width:22px;height:22px;}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.team-card{text-align:center;}
.team-avatar{width:100px;height:100px;border-radius:50%;background:var(--grad);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;}
.team-card h4{font-size:15px;margin-bottom:2px;}
.team-card span{font-size:12.5px;color:var(--text-faint);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;gap:14px;align-items:flex-start;}
.contact-card .icon-wrap{width:42px;height:42px;border-radius:11px;background:var(--surface-2);color:var(--emerald);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-card .icon-wrap .icon{width:19px;height:19px;}

/* ---------- Why / How it works / Testimonials ---------- */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.why-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px 22px;transition:transform .2s ease;}
.why-card:hover{transform:translateY(-4px);}
.why-card .icon-wrap{width:48px;height:48px;border-radius:13px;background:var(--surface-2);color:var(--emerald);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.why-card .icon-wrap .icon{width:23px;height:23px;}
.why-card h4{font-size:15.5px;margin-bottom:7px;}
.why-card p{color:var(--text-soft);font-size:13.5px;}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative;}
.step-card{text-align:center;position:relative;}
.step-num{width:54px;height:54px;border-radius:50%;background:var(--grad);color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:var(--shadow);}
.step-card h4{font-size:15px;margin-bottom:6px;}
.step-card p{font-size:13.5px;color:var(--text-soft);}
.testimonial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.testimonial-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;}
.testimonial-card .stars{color:#f2b705;display:flex;gap:2px;margin-bottom:14px;}
.testimonial-card .stars .icon{width:14px;height:14px;}
.testimonial-card p{color:var(--text-soft);font-size:14px;margin-bottom:18px;line-height:1.7;}
.t-person{display:flex;align-items:center;gap:10px;}
.t-avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.t-person b{font-size:13.5px;display:block;}
.t-person span{font-size:11.5px;color:var(--text-faint);}

/* ---------- Newsletter / Footer ---------- */
.newsletter{background:var(--grad);border-radius:28px;padding:52px 44px;text-align:center;color:#fff;}
.newsletter h2{color:#fff;font-size:clamp(24px,3vw,32px);margin-bottom:10px;}
.newsletter p{opacity:.9;margin-bottom:26px;}
.nl-form{display:flex;gap:10px;max-width:460px;margin:0 auto;flex-wrap:wrap;justify-content:center;}
.nl-form input{flex:1;min-width:220px;padding:13px 18px;border-radius:100px;border:none;font-family:inherit;font-size:14px;}
.footer{border-top:1px solid var(--border);padding:60px 0 26px;margin-top:20px;}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr;gap:34px;margin-bottom:40px;}
.footer-col h5{font-size:13.5px;margin-bottom:16px;font-weight:700;}
.footer-col li{margin-bottom:10px;}
.footer-col a{color:var(--text-soft);font-size:13.5px;}
.footer-col a:hover{color:var(--emerald);}
.footer-brand p{color:var(--text-soft);font-size:13.5px;margin:14px 0 18px;max-width:260px;}
.social-row{display:flex;gap:10px;}
.social-row a{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}
.social-row a:hover{background:var(--grad);color:#fff;}
.social-row .icon{width:15px;height:15px;}
.footer-bottom{border-top:1px solid var(--border);padding-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-faint);flex-wrap:wrap;gap:10px;}

/* ---------- Modal / Toast / Misc ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,10,.55);backdrop-filter:blur(3px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:22px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:30px;position:relative;box-shadow:var(--shadow-lg);animation:modalIn .28s ease;}
@keyframes modalIn{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:none;display:flex;align-items:center;justify-content:center;color:var(--text);z-index:2;}
.qv-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
.qv-visual{height:280px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);}
.qv-visual .icon{width:100px;height:100px;}

.toast-container{position:fixed;bottom:26px;right:26px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:320px;}
.toast{background:var(--charcoal);color:#fff;padding:14px 18px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.3);animation:toastIn .3s ease;}
.toast .icon{width:17px;height:17px;color:var(--lime);flex-shrink:0;}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.leaving{animation:toastOut .3s ease forwards;}
@keyframes toastOut{to{transform:translateX(40px);opacity:0}}

.back-to-top{position:fixed;bottom:26px;left:26px;width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;border:none;display:none;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(22,163,74,.4);z-index:150;transition:transform .2s ease;}
.back-to-top.show{display:flex;}
.back-to-top:hover{transform:translateY(-3px);}
.back-to-top .icon{width:18px;height:18px;}

.page-loader{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s ease;}
.page-loader .loader-mark{width:56px;height:56px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;animation:pulse 1.1s ease-in-out infinite;}
.page-loader .loader-mark .icon{width:28px;height:28px;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.page-loader span{font-family:'Poppins',sans-serif;font-weight:700;color:var(--forest);}
[data-theme="dark"] .page-loader span{color:var(--lime);}

.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.skeleton-block{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-visual{height:180px;}
.sk-line{height:12px;margin:14px 16px;border-radius:6px;}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in-view{opacity:1;transform:translateY(0);}

/* ---------- Responsive ---------- */
@media(max-width:1080px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-visual{height:320px;order:-1;}
  .stats-grid,.cat-grid,.product-grid,.why-grid,.steps-row,.testimonial-grid,.principles-grid,.team-grid,.impact-grid,.badges-grid{grid-template-columns:repeat(2,1fr);}
  .shop-layout{grid-template-columns:1fr;}
  .filters-panel{position:static;}
  .detail-grid,.cart-layout,.checkout-layout,.dash-grid,.about-split,.contact-grid,.form-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .nav-links{display:none;}
  .mobile-toggle{display:flex;}
}
@media(max-width:640px){
  .stats-grid,.cat-grid,.product-grid,.why-grid,.steps-row,.testimonial-grid,.principles-grid,.team-grid,.impact-grid,.badges-grid{grid-template-columns:1fr 1fr;}
  .section{padding:52px 0;}
  .hero{padding:44px 0 60px;}
  .cart-item{grid-template-columns:56px 1fr;grid-template-rows:auto auto;}
  .cart-item .cart-qty{grid-column:2;}
  .search-wrap.open .search-input{width:150px;}
  .footer-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:420px){
  .stats-grid,.cat-grid,.product-grid,.why-grid,.steps-row,.testimonial-grid,.principles-grid,.team-grid,.impact-grid,.badges-grid{grid-template-columns:1fr;}
}

/* ================= ROUTER ================= */
const NAV_ITEMS = [
 {label:'Home', hash:'#/home', key:'home'},
 {label:'Shop', hash:'#/shop', key:'shop'},
 {label:'Categories', hash:'#/categories', key:'categories'},
 {label:'Compare', hash:'#/compare', key:'compare'},
 {label:'Impact', hash:'#/impact', key:'impact'},
 {label:'About', hash:'#/about', key:'about'},
];

function parseHash(){
  let h = location.hash || '#/home';
  h = h.slice(1); // remove #
  const [path, qs] = h.split('?');
  const params = {};
  if(qs){qs.split('&').forEach(pair=>{const [k,v]=pair.split('=');if(k)params[decodeURIComponent(k)]=decodeURIComponent(v||'');});}
  return {path: path==='' || path==='/' ? '/home' : path, params};
}
function goTo(hash){location.hash = hash;}
window.goTo = goTo;

function route(){
  const {path, params} = parseHash();
  const key = path.replace('/','');
  renderNavbar(key);
  const page = document.getElementById('page');
  let html = '';
  switch(key){
    case 'home': html = renderHome(); break;
    case 'shop': html = renderShop(params); break;
    case 'categories': html = renderCategories(); break;
    case 'product': html = renderProductDetail(params); break;
    case 'compare': html = renderCompare(); break;
    case 'wishlist': html = renderWishlist(); break;
    case 'cart': html = renderCart(); break;
    case 'checkout': html = renderCheckout(); break;
    case 'impact': html = renderImpact(); break;
    case 'about': html = renderAbout(); break;
    default: html = renderHome();
  }
  page.innerHTML = html + renderFooter();
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant' : 'auto'});
  afterRender(key, params);
  initReveal();
}
window.addEventListener('hashchange', route);

  ).join('');

/* ================= SHARED HELPERS ================= */
function stars(rating, big){
  let out = '';
  for(let i=1;i<=5;i++){
    out += i<=Math.round(rating) ? iconFill('star') : icon('star');
  }
  return `<span class="stars">${out}</span>`;
}
function productVisual(p, h){
  const [c1,c2] = catColors(p.category);
  return `<div class="product-visual" style="height:${h||180}px;background:linear-gradient(135deg,${c1},${c2})">${icon(p.icon)}</div>`;
}
function money(n){return '₹'+n.toLocaleString('en-IN');}

function productCard(p){
  const inWishlist = wishlist.includes(p.id);

function skeletonCards(n){

/* ================= TOASTS ================= */
function toast(msg, iconName){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon(iconName||'check')}<span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(),300);
  }, 2600);
}

/* ================= CART / WISHLIST / COMPARE ACTIONS ================= */
function addToCart(id, qty){
  qty = qty || 1;
  const existing = cart.find(i=>i.id===id);
  if(existing) existing.qty += qty; else cart.push({id, qty});
  saveCart();
  renderNavbar(parseHash().path.replace('/',''));
  toast('Added to cart', 'cart');
}
window.addToCart = addToCart;

function removeFromCart(id){
  cart = cart.filter(i=>i.id!==id);
  saveCart();
  route();
  toast('Removed from cart','x');
}
window.removeFromCart = removeFromCart;

function changeQty(id, delta){
  const item = cart.find(i=>i.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ cart = cart.filter(i=>i.id!==id); }
  saveCart();
  route();
}
window.changeQty = changeQty;

function toggleWishlist(id){
  if(wishlist.includes(id)){
    wishlist = wishlist.filter(w=>w!==id);
    toast('Removed from wishlist','x');
  } else {
    wishlist.push(id);
    toast('Added to wishlist','heart');
  }
  saveWishlist();
  renderNavbar(parseHash().path.replace('/',''));
  const {path} = parseHash();
  if(['/wishlist','/shop','/product'].includes(path)) route();
}
window.toggleWishlist = toggleWishlist;
function removeFromWishlist(id){
  wishlist = wishlist.filter(w=>w!==id);
  saveWishlist();
  route();
  toast('Removed from wishlist','x');
}
window.removeFromWishlist = removeFromWishlist;

function toggleCompare(id){
  if(compareList.includes(id)){
    compareList = compareList.filter(c=>c!==id);
  } else {
    if(compareList.length>=3){ toast('You can compare up to 3 products','x'); route(); return; }
    compareList.push(id);
    toast('Added to compare','scale');
  }
  saveCompare();
  route();
}
window.toggleCompare = toggleCompare;
function removeFromCompare(id){
  compareList = compareList.filter(c=>c!==id);
  saveCompare();
  route();
}
window.removeFromCompare = removeFromCompare;
function clearCompare(){
  compareList = [];
  saveCompare();
  route();
  toast('Comparison cleared','x');
}
window.clearCompare = clearCompare;

function filteredProducts(){
  let list = PRODUCTS.filter(p=>{
    if(shopFilters.q && !p.name.toLowerCase().includes(shopFilters.q.toLowerCase()) && !p.category.toLowerCase().includes(shopFilters.q.toLowerCase())) return false;
    if(shopFilters.cats.length && !shopFilters.cats.includes(p.category)) return false;
    if(p.price > Number(shopFilters.price)) return false;
    if(p.ecoScore < Number(shopFilters.eco)) return false;
    if(shopFilters.rating && p.rating < shopFilters.rating) return false;
    if(shopFilters.materials.length && !shopFilters.materials.some(m=>p.material.includes(m))) return false;
    return true;
  });
  switch(shopFilters.sort){
    case 'price-asc': list.sort((a,b)=>a.price-b.price); break;
    case 'price-desc': list.sort((a,b)=>b.price-a.price); break;
    case 'eco': list.sort((a,b)=>b.ecoScore-a.ecoScore); break;
    case 'rating': list.sort((a,b)=>b.rating-a.rating); break;
    default: list.sort((a,b)=>b.reviews-a.reviews);
  }
  return list;
}

}

/* ================= SCROLL REVEAL / COUNTERS / BACK TO TOP ================= */
let revealObserver;
function initReveal(){
  const els = document.querySelectorAll('.reveal:not(.in-view)');
  if(!revealObserver){
    revealObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in-view'); revealObserver.unobserve(e.target); } });
    },{threshold:0.12});
  }
  els.forEach(el=>revealObserver.observe(el));
  initCounters();
}
let counterObserver;
function initCounters(){
  const counters = document.querySelectorAll('[data-count]:not(.counted)');
  if(!counterObserver){
    counterObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          animateCounter(e.target);
          e.target.classList.add('counted');
          counterObserver.unobserve(e.target);
        }
      });
    },{threshold:0.4});
  }
  counters.forEach(c=>counterObserver.observe(c));
}
function animateCounter(el){
  const target = parseFloat(el.dataset.count);
  const decimals = parseInt(el.dataset.decimal||'0');
  const dur = 1400;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target*eased;
    el.textContent = decimals ? val.toFixed(decimals) : Math.floor(val).toLocaleString('en-IN');
    if(p<1) requestAnimationFrame(step);
    else el.textContent = decimals ? target.toFixed(decimals) : target.toLocaleString('en-IN');
  }
  requestAnimationFrame(step);
}

document.getElementById('backToTop').innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>`;
window.addEventListener('scroll', ()=>{
  document.getElementById('backToTop').classList.toggle('show', window.scrollY>420);
});
document.getElementById('backToTop').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ================= PAGE-SPECIFIC AFTER RENDER ================= */
let impactChartInstance;
function afterRender(key, params){
  if(key==='shop'){
    setTimeout(renderShopGrid, 260);
  }
  if(key==='impact'){
    const ctx = document.getElementById('impactChart');
    if(ctx && window.Chart){
      if(impactChartInstance) impactChartInstance.destroy();
      const styles = getComputedStyle(document.documentElement);
      impactChartInstance = new Chart(ctx, {
        type:'line',
        data:{
          labels:['Apr','May','Jun','Jul','Aug','Sep'],
          datasets:[{
            label:'CO₂ reduced (kg)',
            data:[8,14,19,26,31,38 + orderHistory.length*4],
            borderColor:'#16A34A',
            backgroundColor:'rgba(132,204,22,.18)',
            fill:true, tension:.4, pointBackgroundColor:'#14532D', pointRadius:4
          }]
        },
        options:{
          responsive:true,
          plugins:{legend:{display:false}},
          scales:{
            x:{grid:{display:false}, ticks:{color: theme==='dark' ? '#a9b8a5' : '#526051'}},
            y:{grid:{color: theme==='dark' ? '#26332a' : '#e3e7db'}, ticks:{color: theme==='dark' ? '#a9b8a5' : '#526051'}}
          }
        }
      });
    }
  }
}

/* ================= INIT ================= */
window.addEventListener('DOMContentLoaded', ()=>{
  route();
  setTimeout(()=>{
    const loader = document.getElementById('pageLoader');
    loader.style.opacity = '0';
    setTimeout(()=>loader.remove(), 420);
  }, 550);
});
</script>
